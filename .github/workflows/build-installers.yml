name: Build installers

on:
  push:
    branches:
      - main
      - installer-build-v1.4.0
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name HashcatGUI src/hashcat_GUI.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HashcatGUI-v1.4.0-windows-x64-setup
          path: installer-output/HashcatGUI-v1.4.0-windows-x64-setup.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build DMG
        run: bash installer/build_macos_dmg.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: HashcatGUI-v1.4.0-macos-arm64
          path: installer-output/HashcatGUI-v1.4.0-macos-arm64.dmg
          if-no-files-found: error
